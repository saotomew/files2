<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For you</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:linear-gradient(160deg,#f5e9d9 0%,#ead5ba 55%,#dfc3a2 100%) fixed;color:#3a2a22;font-family:'Nunito',sans-serif;line-height:1.85;font-size:1.05rem}
  main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:64px 22px 90px}
  h1{font-family:'Bricolage Grotesque',sans-serif;font-size:2.4rem;text-align:center;margin:0 0 8px}
  .note{text-align:center;opacity:.75;margin:0 0 28px}
  input{width:100%;font:inherit;font-size:1.6rem;letter-spacing:.6em;text-align:center;padding:12px 14px;border:2px solid #dcc0a0;border-radius:14px;background:#fffaf2;margin-bottom:10px}
  button{display:block;width:100%;font:inherit;font-weight:600;padding:13px;border:0;border-radius:14px;background:#5a3a2a;color:#fff;cursor:pointer}
  #error{text-align:center;color:#a63a2f;min-height:1.5em;margin-top:10px}
  #letter{display:none;white-space:pre-wrap;background:#fffaf2;border-radius:20px;padding:26px 24px;box-shadow:0 8px 20px rgba(60,40,10,.12)}
  a{color:#5a3a2a}
  .back{display:block;text-align:center;margin-top:40px}
  .hearts{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .hearts span{position:absolute;bottom:-40px;opacity:.35;animation:floatUp linear infinite}
  @keyframes floatUp{0%{transform:translate(0,0) rotate(-10deg)}50%{transform:translate(18px,-55vh) rotate(10deg)}100%{transform:translate(-10px,-115vh) rotate(-10deg)}}
  @media (prefers-reduced-motion:reduce){.hearts span{animation:none;bottom:var(--b)}}
  :focus-visible{outline:3px solid #5a3a2a;outline-offset:2px}
</style>
</head>
<body>
<div class="hearts" id="hearts"></div>
<main>
  <h1>For you</h1>

  <div id="gate">
    <p class="note">(can be opened by Jude only)</p>
    <form id="form">
      <input type="password" id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••" autocomplete="off">
      <button type="submit" id="open">Open</button>
      <p id="error"></p>
    </form>
  </div>

  <div id="letter"></div>

  <a class="back" href="index.html">← Back</a>
</main>

/* ---------- you don't need to change anything below ---------- */
async function unlock(pin){
  const raw = Uint8Array.from(atob(SECRET), c => c.charCodeAt(0));
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:raw.slice(0,16), iterations:600000, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:raw.slice(16,28) }, key, raw.slice(28));
  return new TextDecoder().decode(pt);
}
const pinEl = document.getElementById('pin'), err = document.getElementById('error');
async function tryOpen(){
  if(pinEl.value.length !== 4) return;
  err.textContent = 'Opening...';
  try{
    document.getElementById('letter').textContent = await unlock(pinEl.value);
    document.getElementById('gate').style.display = 'none';
    document.getElementById('letter').style.display = 'block';
  }catch(e){ err.textContent = 'Wrong PIN, try again.'; pinEl.value = ''; }
}
document.getElementById('form').addEventListener('submit', e => { e.preventDefault(); tryOpen(); });
pinEl.addEventListener('input', () => { pinEl.value = pinEl.value.replace(/\D/g, ''); if(pinEl.value.length === 4) tryOpen(); });

// floating hearts
(() => {
  const wrap = document.getElementById('hearts'), colors = ['#d98c8c','#c8a27a','#b5735a','#e8b4a0'];
  for(let i = 0; i < 22; i++){
    const h = document.createElement('span'); h.textContent = '♥';
    h.style.cssText = `left:${Math.random()*100}%;--b:${Math.random()*95}%;font-size:${10+Math.random()*18}px;color:${colors[i%4]};animation-duration:${14+Math.random()*16}s;animation-delay:-${Math.random()*30}s`;
    wrap.appendChild(h);
  }
})();
</script>

</html>
